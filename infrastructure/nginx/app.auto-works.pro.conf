# Nginx config for app.auto-works.pro → tenant-app backend на :8002.
#
# Заменяет старую секцию `server_name app.auto-works.pro` в
# /etc/nginx/sites-enabled/auto-works.pro (раньше шла на :3000).
#
# Установка:
#   sudo cp app.auto-works.pro.conf /etc/nginx/sites-available/
#   # отредактировать /etc/nginx/sites-enabled/auto-works.pro,
#   # удалить старый блок про app.auto-works.pro
#   sudo ln -sf /etc/nginx/sites-available/app.auto-works.pro.conf \
#               /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.auto-works.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.auto-works.pro;

    ssl_certificate     /etc/letsencrypt/live/auto-works.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto-works.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Логи отдельно — проще отлавливать tenant-app траффик.
    access_log /var/log/nginx/app.auto-works.pro.access.log;
    error_log  /var/log/nginx/app.auto-works.pro.error.log;

    # Размер upload (PDF / Excel / фото запчастей могут быть большими).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для долгих запросов (отчёты, ЮКасса webhook).
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
