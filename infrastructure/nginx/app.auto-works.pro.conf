# Nginx config for app.auto-works.pro.
#
# Разводит трафик между backend (FastAPI tenant-app, :8002) и frontend
# (SPA, nginx-static в контейнере, :8004):
#
#   /api/...        → :8002   (REST API)
#   /docs           → :8002   (Swagger UI)
#   /redoc          → :8002   (ReDoc UI)
#   /openapi.json   → :8002   (OpenAPI schema)
#   /health         → :8002   (health-check)
#   /               → :8004   (SPA: index.html + assets, SPA-routing внутри контейнера)
#
# Установка:
#   sudo cp app.auto-works.pro.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/app.auto-works.pro.conf \
#               /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.auto-works.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.auto-works.pro;

    ssl_certificate     /etc/letsencrypt/live/auto-works.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto-works.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/app.auto-works.pro.access.log;
    error_log  /var/log/nginx/app.auto-works.pro.error.log;

    # Размер upload (PDF / Excel / фото запчастей могут быть большими).
    client_max_body_size 50M;

    # Общие proxy-параметры — определяем один раз через include? Нет,
    # nginx без cli не поддерживает re-use, дублируем в каждом location.

    # ── Backend (FastAPI) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Долгие запросы (отчёты, ЮКасса webhook).
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (SPA) ────────────────────────────────────────────────
    # Внутри контейнера nginx уже делает try_files $uri /index.html для
    # SPA-роутов, поэтому здесь просто прокси на корень.
    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
