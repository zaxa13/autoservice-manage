gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Хешированные ассеты Vite (index-<hash>.js / .css) — immutable на год.
    # Любой новый билд = новый хеш, поэтому кэш-инвалидации не нужно.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html — не кэшируем, чтобы клиенты сразу подхватывали свежий
    # бандл после деплоя (ETag/Last-Modified остаются — будет 304).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: bundle/asset запрашивается по точному пути (matches $uri),
    # любой другой URL отдаёт index.html — Router внутри React разруливает.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api на этом контейнере не обслуживается — host nginx перехватывает
    # /api/... раньше и проксирует на backend (:8002). Если запрос всё же
    # дошёл сюда (прямой curl на :8003), вернём 404, чтобы не было ложного
    # ощущения, что бэкенд за этим контейнером.
    location ~ ^/(api|docs|redoc|openapi\.json|health)(/|$) {
        return 404;
    }
}
