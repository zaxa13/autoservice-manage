name: deploy-dev

# Авто-деплой dev tenant-app (app-dev.auto-works.pro) при пуше в develop.
# self-hosted раннер на VPS. Миграции идут автоматически в entrypoint.sh
# (alembic upgrade head, session-pool, schema=app) при старте контейнера.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev-tenant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    env:
      DIR: /root/dev/autoservice-manage
      COMPOSE: docker-compose.app.yml
      ENVFILE: .env.app.dev
    steps:
      - name: Sync repo (develop)
        run: |
          cd "$DIR"
          git fetch --prune origin
          git reset --hard origin/develop

      - name: Build + up (миграции в entrypoint)
        run: |
          cd "$DIR"
          docker compose --env-file "$ENVFILE" -f "$COMPOSE" up -d --build

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8102/health && exit 0
            sleep 3
          done
          echo "tenant-app dev health failed"; docker logs autoworks-tenant-app-dev --tail 30; exit 1
